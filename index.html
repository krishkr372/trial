<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLI Local Interpreter</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        .video-container { position: relative; width: 640px; height: 480px; margin-top: 20px; background: #000; border-radius: 8px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
        canvas { z-index: 2; pointer-events: none; }
        #output-box { margin-top: 20px; padding: 15px 30px; font-size: 24px; font-weight: bold; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>Sign Language Interpreter</h1>
    
    <div class="video-container">
        <!-- Raw webcam video feed -->
        <video id="webcam" autoplay playsinline muted></video>
        <!-- Overlay canvas to draw hand landmarks -->
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- Real-time translation box -->
    <div id="output-box">Predicted Sign: <span id="prediction">-</span></div>

    <!-- Main JS Orchestrator -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
